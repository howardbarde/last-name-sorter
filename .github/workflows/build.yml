
# Name Sorter - Build Pipeline
#
# Builds the Java application, runs the unit tests,
# and checks that the program can process the sample input.

name: Java Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Download the repository code.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Use the same Java version as the project.
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compile the project, run JUnit tests, and create the JAR.
      - name: Build with Maven
        run: mvn --batch-mode clean verify

      # Run the application with the sample input file.
      - name: Run Name Sorter
        run: |
          java -cp target/classes com.howard.namesorter.Main \
            ./input/unsorted-names-list.txt

      # Check that the application created its expected output.
      - name: Verify output file
        run: |
          test -f output/sorted-names-list.txt
          echo "Output file created successfully."

      # Save the compiled JAR as a downloadable build artifact.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: name-sorter-jar
          path: target/*.jar
          if-no-files-found: error
